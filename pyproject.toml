[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-workspace"
version = "0.5.0"
description = "Claude Code agent workspace: subagent definitions plus the standalone Google Calendar scheduler"
requires-python = ">=3.10"
authors = [
    {name = "Nguyen Le Dang Nguyen", email = "nguyen.nguyen30@momo.vn"}
]
# Runtime dependencies for the scheduler plus the intent-parser / data-access
# layer under .claude/system and .claude/clients.
dependencies = [
    "google-auth-oauthlib>=1.2,<2.0",
    "google-auth-httplib2>=0.2,<0.3",
    "google-api-python-client>=2.108,<3.0",
    "openai>=2.0,<3.0",
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "google-cloud-bigquery>=3.0,<4.0",
    "filelock>=3.0,<4.0",
]

[project.optional-dependencies]
scheduler-extras = [
    "python-dateutil>=2.8,<3.0",
]

[tool.setuptools]
# The source directory is `.claude`, whose leading dot is not a valid module
# name, so it is remapped to the importable package `claude`.
packages = [
    "claude",
    "claude.agents",
    "claude.agents.team",
    "claude.agents.tools",
    "claude.agents.tools.scheduler",
    "claude.clients",
    "claude.system",
]
package-dir = {"claude" = ".claude"}

[tool.setuptools.package-data]
claude = ["**/*.py"]
