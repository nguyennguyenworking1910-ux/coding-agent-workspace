[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-workspace"
version = "0.2.0"
description = "Claude Code agent orchestration system"
requires-python = ">=3.9"
authors = [
    {name = "Nguyen Le Dang Nguyen", email = "nguyen.nguyen30@momo.vn"}
]

[project.scripts]
coding-agent-workspace = "workspace_cli.cli:main"

[tool.setuptools]
packages = ["workspace_cli"]
