[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-workspace"
version = "0.3.0"
description = "Claude Code agent orchestration system with tmux-based agent execution"
requires-python = ">=3.9"
authors = [
    {name = "Nguyen Le Dang Nguyen", email = "nguyen.nguyen30@momo.vn"}
]

[project.scripts]
coding-agent-workspace = "workspace_cli.cli:main"

[tool.setuptools]
packages = ["workspace_cli", "claude", "claude.agents", "claude.agents.technical", "claude.agents.business", "claude.tools"]
package-dir = {"claude" = ".claude"}

[tool.setuptools.package-data]
claude = ["**/*.py"]
workspace_cli = ["**/*.py"]
